    - planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709
    - hhs.gov/hipaa
    - edpb.europa.eu
  cloud_services:
    description: Preços, SLAs, limites e recursos de serviços em nuvem
    mandatory_search: true
    authoritative_sources:
    - cloud.google.com/pricing
    - aws.amazon.com/pricing
    - azure.microsoft.com/pricing
    - oracle.com/cloud/pricing
    - digitalocean.com/pricing
    - linode.com/pricing
    - vultr.com/pricing
  scientific_claims:
    description: Afirmações sobre evidências científicas, eficácia de técnicas, benchmarks
      de pesquisa
    mandatory_search: true
    authoritative_sources:
    - pubmed.ncbi.nlm.nih.gov
    - cochranelibrary.com
    - scholar.google.com
    note: 'INDEPENDENTE do medical-gate. O medical-gate cobre publicação de conteúdo
      clínico para USUÁRIOS FINAIS (pipeline DRAFT→REVIEW→ACTIVE). Este domínio cobre
      afirmações durante PLANEJAMENTO e BRAINSTORMING (ex: "técnica X tem 90% de acurácia
      segundo estudo Y"). Ambos são necessários — cobrem fases distintas.'
exempt_domains:
- Sintaxe de linguagem de programação (Python, JS, SQL, Bash, etc.)
- Algoritmos e estruturas de dados fundamentais (ordenação, grafos, etc.)
- Conceitos de arquitetura de software (SOLID, DDD, Clean Architecture, etc.)
- Lógica de negócio específica deste projeto (definida na spec)
- Comandos de terminal e shell (ls, git, grep, awk, etc.)
- Padrões de design de software (Factory, Observer, Strategy, etc.)
